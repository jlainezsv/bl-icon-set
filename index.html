<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>my-icon-font</title>
  <link rel="stylesheet" href="my-icon-font.css" />
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      margin-bottom: 1rem;
    }
    #icon-grid {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .icon {
      background: #f0f0f0;
      border-radius: 4px;
      padding: 1rem;
      width: 80px;
      cursor: pointer;
      user-select: none;
    }
    .icon i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
    }
    .icon span {
      font-size: 0.75rem;
      color: #777;
      user-select: text;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>my-icon-font</h1>
  <div id="icon-grid"></div>

  <script>
    function getIconClassNames() {
      const classNames = [];
      for (const sheet of document.styleSheets) {
        try {
          for (const rule of sheet.cssRules) {
            if (rule.selectorText?.startsWith('.icon-')) {
              const matches = rule.selectorText.match(/\.icon-([a-zA-Z0-9_-]+)/g);
              if (matches) {
                matches.forEach(sel => {
                  const name = sel.replace('.icon-', '');
                  if (!classNames.includes(name)) {
                    classNames.push(name);
                  }
                });
              }
            }
          }
        } catch (e) {
          // Ignorar reglas protegidas por CORS
        }
      }
      return classNames.sort();
    }

    function renderIcons() {
      const icons = getIconClassNames();
      const grid = document.getElementById('icon-grid');

      icons.forEach(name => {
        const div = document.createElement('div');
        div.className = 'icon';
        div.title = `Click to copy: icon-${name}`;
        div.innerHTML = `
          <i class="icon-${name}"></i>
          <span>icon-${name}</span>
        `;

        div.addEventListener('click', () => {
          navigator.clipboard.writeText(`icon-${name}`).catch(() => {
            // fallback or silently fail
          });
        });

        grid.appendChild(div);
      });
    }

    window.onload = () => {
      renderIcons();
    };
  </script>
</body>
</html>
