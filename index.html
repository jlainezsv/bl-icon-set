<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Icon Font Demo</title>
  <link rel="stylesheet" href="my-icon-font.css" />
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    .icon {
      display: inline-block;
      text-align: center;
      margin: 1rem;
      cursor: pointer;
      position: relative;
      overflow: visible;
    }
    .icon i {
      font-size: 2rem;
      display: block;
    }
    .icon span {
      margin-top: 0.5rem;
      display: block;
      color: #333;
    }
    .tooltip {
      position: absolute;
      top: -1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background-color: #333;
      color: #fff;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 10;
    }
    .tooltip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .tooltip.hide {
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
      pointer-events: none;
    }
  </style>
  <script>
    div.addEventListener('click', () => {
  navigator.clipboard.writeText(`icon-${name}`);

  tooltip.classList.remove('hide');
  tooltip.classList.add('show');

  // Después de 1.5s ocultar con transition
  setTimeout(() => {
    tooltip.classList.remove('show');
    tooltip.classList.add('hide');
  }, 500);
});

  </script>
</head>
<body>
  <h1>Icon Font Demo</h1>
  <div id="icon-grid"></div>

  <script>
    function getIconClassNames() {
      const classNames = [];
      for (const sheet of document.styleSheets) {
        try {
          for (const rule of sheet.cssRules) {
            if (rule.selectorText?.startsWith('.icon-')) {
              const matches = rule.selectorText.match(/\.icon-([a-zA-Z0-9_-]+)/g);
              if (matches) {
                matches.forEach(sel => {
                  const name = sel.replace('.icon-', '');
                  if (!classNames.includes(name)) {
                    classNames.push(name);
                  }
                });
              }
            }
          }
        } catch (e) {
          // Ignorar reglas protegidas por CORS
        }
      }
      return classNames.sort();
    }

    function renderIcons() {
      const icons = getIconClassNames();
      const grid = document.getElementById('icon-grid');

      icons.forEach(name => {
        const div = document.createElement('div');
        div.className = 'icon';
        div.innerHTML = `
          <i class="icon-${name}"></i>
          <span>.icon-${name}</span>
          <div class="tooltip">Copiado</div>
        `;
        const tooltip = div.querySelector('.tooltip');

        div.addEventListener('click', () => {
          navigator.clipboard.writeText(`icon-${name}`);

          tooltip.classList.remove('hide');
          tooltip.classList.add('show');

          setTimeout(() => {
            tooltip.classList.remove('show');
            tooltip.classList.add('hide');
          }, 1500);
        });

        grid.appendChild(div);
      });
    }

    window.onload = () => {
      renderIcons();
    };
  </script>
</body>
</html>
