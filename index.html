<!-- templates/template.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Icon Font Demo</title>
  <link rel="stylesheet" href="my-icon-font.css" />
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    .icon {
      display: inline-block;
      text-align: center;
      margin: 1rem;
      cursor: pointer;
    }
    .icon i {
      font-size: 2rem;
      display: block;
    }
    .icon span {
      margin-top: 0.5rem;
      display: block;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Icon Font Demo</h1>
  <div id="icon-grid"></div>

  <script>
    const icons = [
      
    ];

    const grid = document.getElementById('icon-grid');
    icons.forEach(name => {
      const div = document.createElement('div');
      div.className = 'icon';
      div.innerHTML = `
        <i class="icon-${name}"></i>
        <span>.icon-${name}</span>
      `;
      div.addEventListener('click', () => {
        navigator.clipboard.writeText(`icon-${name}`);
        alert(\`Copied: icon-${name}\`);
      });
      grid.appendChild(div);
    });
  </script>
</body>
</html>
